<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <rect width="900" height="160" fill="#13141a"/>

  <!-- Terminal: >_ -->
  <g transform="translate(90, 80)" stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="7">
    <polyline points="-30,-26 8,0 -30,26"/>
    <line x1="14" y1="26" x2="46" y2="26"/>
  </g>

  <!-- Coffee cup -->
  <g transform="translate(272, 80)">
    <path d="M-10,-38 Q-5,-50 -10,-60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M2,-35 Q7,-47 2,-57"  stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M14,-38 Q19,-50 14,-60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-28,-28 L-20,36 Q-20,42 -13,42 L13,42 Q20,42 20,36 L28,-28 Z" fill="white"/>
    <path d="M20,-6 Q44,-6 44,14 Q44,34 20,30" stroke="white" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- JS square -->
  <g transform="translate(450, 80)">
    <rect x="-40" y="-40" width="80" height="80" rx="4" fill="white"/>
    <text x="-1" y="16" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="33" fill="#13141a" text-anchor="middle">JS</text>
  </g>

  <!-- Music notes -->
  <g transform="translate(610, 80)" fill="white">
    <rect x="2" y="-44" width="52" height="8" rx="3"/>
    <rect x="2" y="-44" width="7" height="52" rx="3"/>
    <ellipse cx="2" cy="14" rx="13" ry="9" transform="rotate(-16,2,14)"/>
    <rect x="47" y="-44" width="7" height="52" rx="3"/>
    <ellipse cx="47" cy="14" rx="13" ry="9" transform="rotate(-16,47,14)"/>
  </g>

  <!-- </> -->
  <g transform="translate(810, 80)" stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="7">
    <polyline points="-30,-26 -58,0 -30,26"/>
    <line x1="-14" y1="30" x2="14" y2="-30"/>
    <polyline points="30,-26 58,0 30,26"/>
  </g>
</svg>
